# Flow Matching Policy default configuration
# Lipman et al., 2023 / Liu et al., 2023 -- rectified flow with 1D U-Net

policy_type: "flow_matching"

# Action / observation dimensions
action_dim: 2
horizon: 16
obs_dim: 4

# Flow-matching hyperparameters
num_flow_steps: 10

# Network architecture
hidden_dim: 256
num_layers: 4

# Training
lr: 1.0e-4
epochs: 200
batch_size: 64
