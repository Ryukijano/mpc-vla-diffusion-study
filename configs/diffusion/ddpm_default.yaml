# DDPM Diffusion Policy default configuration
# Chi et al., RSS 2023 -- noise-prediction DDPM with 1D temporal U-Net

policy_type: "ddpm"

# Action / observation dimensions
action_dim: 2
horizon: 16
obs_dim: 4

# Diffusion hyperparameters
num_diffusion_steps: 100
noise_schedule: "linear"   # linear | cosine

# Network architecture
hidden_dim: 256
num_layers: 4

# Training
lr: 1.0e-4
epochs: 200
batch_size: 64
