# =============================================================================
# 2D Reaching Benchmark Configuration (cluttered / with obstacles)
# =============================================================================
# A 2-D point mass must reach a target position while avoiding multiple
# circular obstacles.  Double-integrator dynamics.

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env:
  class: "ReachingEnv"
  module: "benchmarks.reaching_env"
  params:
    dim: 2
    dt: 0.05
    success_threshold: 0.1
    max_steps: 250
    image_size: 96
    workspace: 5.0
    seed: 0
    obstacles:
      - {center: [1.5, 1.5], radius: 0.4}
      - {center: [2.5, 2.5], radius: 0.5}
      - {center: [3.0, 1.0], radius: 0.35}
      - {center: [1.0, 3.0], radius: 0.3}
      - {center: [3.5, 3.0], radius: 0.3}
      - {center: [-2.0, -1.5], radius: 0.45}
      - {center: [-3.0, 2.0], radius: 0.35}

# ---------------------------------------------------------------------------
# Observation / action spaces
# ---------------------------------------------------------------------------
spaces:
  observation_dim: 4          # [x, y, vx, vy]
  action_dim: 2               # [ax, ay]
  image_shape: [96, 96, 3]

# ---------------------------------------------------------------------------
# Task metadata
# ---------------------------------------------------------------------------
task:
  name: "Reaching (2D Cluttered)"
  description: "2D point-mass reaching with dense obstacles"
  multimodal: true
  language_instruction: "Reach the green target in the plane while avoiding obstacles."

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  n_episodes: 50
  seeds: [0, 1, 2, 42, 123]
  metrics:
    - "success_rate"
    - "mean_return"
    - "path_length"
    - "collision_rate"
    - "mean_inference_latency"

# ---------------------------------------------------------------------------
# Demonstration collection
# ---------------------------------------------------------------------------
demonstrations:
  n_demos: 100
  max_steps: 250
  expert: "builtin"           # uses ReachingEnv.generate_expert_demonstrations
  save_path: "data/reaching_2d_cluttered_demos.npz"

# ---------------------------------------------------------------------------
# Controller-specific settings
# ---------------------------------------------------------------------------
controllers:
  mpc:
    horizon: 15
    dt: 0.05
    control_bounds: [-1.0, 1.0]
    collision_avoidance: true
  vla:
    image_size: 96
    instruction: "Reach the green target in the plane while avoiding obstacles."
  diffusion:
    observation_dim: 4
    action_dim: 2
    diffusion_steps: 100
